<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secrets — Vault</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #141414;
      --surface2: #1a1a1a;
      --border: #2a2a2a;
      --gold: #c9a84c;
      --gold-dim: rgba(201,168,76,0.1);
      --text: #e8e0d0;
      --muted: #6b6560;
      --danger: #c0392b;
      --danger-dim: rgba(192,57,43,0.12);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 400;
    }
    .logo em { font-style: italic; color: var(--gold); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .username-badge {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .username-badge span { color: var(--gold); }

    .logout-btn {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      padding: 7px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .logout-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Main ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 6px;
    }
    .page-title em { font-style: italic; color: var(--gold); }

    .page-sub {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 36px;
      letter-spacing: 0.05em;
    }

    /* ── Add form ── */
    .add-area {
      display: flex;
      gap: 10px;
      margin-bottom: 40px;
    }

    .add-area textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      padding: 14px;
      resize: vertical;
      min-height: 64px;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.6;
    }
    .add-area textarea:focus { border-color: var(--gold); }
    .add-area textarea::placeholder { color: var(--muted); }

    .add-btn {
      background: var(--gold);
      color: #0d0d0d;
      border: none;
      padding: 0 20px;
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      cursor: pointer;
      transition: opacity 0.2s;
      align-self: stretch;
    }
    .add-btn:hover { opacity: 0.8; }

    /* ── Secrets list ── */
    #secrets-list { display: flex; flex-direction: column; gap: 14px; }

    .secret-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px 20px 16px;
      animation: slideIn 0.3s ease both;
      transition: border-color 0.2s;
    }
    .secret-card:hover { border-color: #3a3a3a; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .secret-number {
      font-size: 9px;
      letter-spacing: 0.25em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .secret-text {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
    }

    .secret-edit-area {
      display: none;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--gold);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      padding: 10px 12px;
      resize: vertical;
      min-height: 60px;
      outline: none;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .secret-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .action-btn {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .edit-btn   { color: var(--gold);    }
    .save-btn   { color: var(--gold); display: none; }
    .cancel-btn { color: var(--muted); display: none; }
    .delete-btn { color: var(--danger); margin-left: auto; }

    .action-btn:hover { border-color: currentColor; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.05em;
      line-height: 2;
      display: none;
    }
    .empty-state .big { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: #3a3a3a; font-style: italic; display: block; margin-bottom: 8px; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--gold);
      color: #0d0d0d;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      padding: 10px 20px;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 100;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <div class="logo">My <em>Secrets</em></div>
    <div class="header-right">
      <span class="username-badge">Signed in as <span id="username-display">…</span></span>
      <form action="/logout" method="POST" style="margin:0">
        <button class="logout-btn" type="submit">Sign Out</button>
      </form>
    </div>
  </header>

  <main>
    <h2 class="page-title">The <em>Vault</em></h2>
    <p class="page-sub" id="count-label">Loading your secrets…</p>

    <div class="add-area">
      <textarea id="new-secret" placeholder="Write a new secret…"></textarea>
      <button class="add-btn" id="add-btn" title="Add secret">+</button>
    </div>

    <div id="secrets-list"></div>
    <div class="empty-state" id="empty-state">
      <em class="big">Nothing here yet.</em>
      Write your first secret above and it will be kept safe.
    </div>
  </main>

  <div id="toast"></div>

  <script>
    let secrets = [];

    async function init() {
      const me = await fetch('/api/me').then(r => r.json());
      document.getElementById('username-display').textContent = me.username;
      await loadSecrets();
    }

    async function loadSecrets() {
      secrets = await fetch('/api/secrets').then(r => r.json());
      render();
    }

    function render() {
      const list = document.getElementById('secrets-list');
      const empty = document.getElementById('empty-state');
      const label = document.getElementById('count-label');

      list.innerHTML = '';
      label.textContent = secrets.length === 0
        ? 'Your vault is empty.'
        : `${secrets.length} secret${secrets.length !== 1 ? 's' : ''} stored safely.`;

      empty.style.display = secrets.length === 0 ? 'block' : 'none';

      secrets.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = 'secret-card';
        card.dataset.id = s.id;
        card.innerHTML = `
          <div class="secret-number">Secret #${String(i + 1).padStart(2, '0')}</div>
          <div class="secret-text">${escHtml(s.text)}</div>
          <textarea class="secret-edit-area"></textarea>
          <div class="secret-actions">
            <button class="action-btn edit-btn" onclick="startEdit(this)">Edit</button>
            <button class="action-btn save-btn" onclick="saveEdit(this)">Save</button>
            <button class="action-btn cancel-btn" onclick="cancelEdit(this)">Cancel</button>
            <button class="action-btn delete-btn" onclick="deleteSecret(this)">Delete</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function escHtml(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function startEdit(btn) {
      const card = btn.closest('.secret-card');
      const textEl = card.querySelector('.secret-text');
      const textarea = card.querySelector('.secret-edit-area');
      textarea.value = secrets.find(s => s.id === card.dataset.id).text;
      textEl.style.display = 'none';
      textarea.style.display = 'block';
      textarea.focus();
      card.querySelector('.edit-btn').style.display = 'none';
      card.querySelector('.save-btn').style.display = 'inline-block';
      card.querySelector('.cancel-btn').style.display = 'inline-block';
    }

    function cancelEdit(btn) {
      const card = btn.closest('.secret-card');
      card.querySelector('.secret-text').style.display = 'block';
      card.querySelector('.secret-edit-area').style.display = 'none';
      card.querySelector('.edit-btn').style.display = 'inline-block';
      card.querySelector('.save-btn').style.display = 'none';
      card.querySelector('.cancel-btn').style.display = 'none';
    }

    async function saveEdit(btn) {
      const card = btn.closest('.secret-card');
      const newText = card.querySelector('.secret-edit-area').value.trim();
      if (!newText) return toast('Secret cannot be empty.');
      await fetch(`/api/secrets/${card.dataset.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: newText })
      });
      await loadSecrets();
      toast('Secret updated.');
    }

    async function deleteSecret(btn) {
      const card = btn.closest('.secret-card');
      if (!confirm('Delete this secret permanently?')) return;
      await fetch(`/api/secrets/${card.dataset.id}`, { method: 'DELETE' });
      await loadSecrets();
      toast('Secret deleted.');
    }

    document.getElementById('add-btn').addEventListener('click', async () => {
      const ta = document.getElementById('new-secret');
      const text = ta.value.trim();
      if (!text) return toast('Write something first!');
      await fetch('/api/secrets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      ta.value = '';
      await loadSecrets();
      toast('Secret added to the vault.');
    });

    // Ctrl+Enter to add
    document.getElementById('new-secret').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        document.getElementById('add-btn').click();
      }
    });

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    init();
  </script>
</body>
</html>
